# docker-compose.prod.yml — c7i-flex.large optimized (4GB RAM)
services:
  postgres:
    image: postgres:16-alpine
    container_name: nos-postgres
    mem_limit: 512m # WAS: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nos_db}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
        -c shared_buffers=128MB
        -c max_connections=20
        -c work_mem=8MB
        -c maintenance_work_mem=64MB
        -c effective_cache_size=512MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-nos_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: nos-backend
    mem_limit: 1024m # WAS: 300m
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - NODE_OPTIONS=--max-old-space-size=768 # WAS: 256
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:3001/api/v1/health/live || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: nos-frontend
    mem_limit: 1024m # WAS: 300m
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=768
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nos-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
