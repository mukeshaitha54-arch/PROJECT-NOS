services:
  backend:
    build:
      context: . # ← WAS: ./apps/backend
      dockerfile: apps/backend/Dockerfile
    container_name: nos-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nos-network
    mem_limit: 300m

  frontend:
    build:
      context: . # ← WAS: ./apps/frontend
      dockerfile: apps/frontend/Dockerfile
    container_name: nos-frontend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INTERNAL_BACKEND_URL=http://backend:3001
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - nos-network
    mem_limit: 300m

  postgres:
    image: postgres:16-alpine
    container_name: nos-postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - nos-network
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - nos-network
    mem_limit: 64m

networks:
  nos-network:
    driver: bridge

volumes:
  postgres_data:
