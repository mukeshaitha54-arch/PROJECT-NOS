version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Database Layer
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nos_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_nos_password}
      POSTGRES_DB: ${POSTGRES_DB:-nos_database}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nos_admin} -d ${POSTGRES_DB:-nos_database}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nos_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nos_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@nos.internal}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-secure_pgadmin_password}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nos_network

  # ----------------------------------------------------------------------------
  # Cache & Event Streaming Layer (Prepared for future active integration)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nos_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-secure_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secure_redis_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nos_network

  # ----------------------------------------------------------------------------
  # Application Services Layer
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: nos_backend
    restart: always
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-nos_admin}:${POSTGRES_PASSWORD:-secure_nos_password}@postgres:5432/${POSTGRES_DB:-nos_database}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379/0"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nos_network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: nos_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - nos_network

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    container_name: nos_monitoring_agent
    restart: always
    environment:
      AgentConfig__NodeId: nos-container-agent-001
      AgentConfig__PollIntervalSeconds: 10
      AgentConfig__ApiIngestionEndpoint: http://backend:4000/api/v1
    depends_on:
      - backend
    networks:
      - nos_network

networks:
  nos_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
