version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # Database & Caching Layer (Development Topology)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nos_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_nos_password}
      POSTGRES_DB: ${POSTGRES_DB:-nos_database_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nos_admin} -d ${POSTGRES_DB:-nos_database_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nos_dev_network

  redis:
    image: redis:7-alpine
    container_name: nos_redis_dev
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-secure_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-secure_redis_password}",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nos_dev_network

  # ----------------------------------------------------------------------------
  # Application Layer with Hot-Reloading Bind Mounts
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: nos_backend_dev
    restart: unless-stopped
    command: ["npm", "run", "start:dev"]
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-nos_admin}:${POSTGRES_PASSWORD:-secure_nos_password}@postgres:5432/${POSTGRES_DB:-nos_database_dev}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379/0"
    ports:
      - "4000:4000"
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages/shared-types:/app/packages/shared-types
      - /app/apps/backend/node_modules
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nos_dev_network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: nos_frontend_dev
    restart: unless-stopped
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./packages/shared-types:/app/packages/shared-types
      - /app/apps/frontend/node_modules
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - nos_dev_network

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    container_name: nos_monitoring_agent_dev
    restart: unless-stopped
    environment:
      AgentConfig__NodeId: nos-container-agent-dev-001
      AgentConfig__PollIntervalSeconds: 10
      AgentConfig__ApiIngestionEndpoint: http://nos_backend_dev:4000/api/v1
      AgentConfig__RegistrationKey: nos-reg-key-dev-1234
      NOS_AGENT_SIMULATION_MODE: "true"
    depends_on:
      - backend
    networks:
      - nos_dev_network

networks:
  nos_dev_network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
